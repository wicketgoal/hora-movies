<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HORA Movies — Stream Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hm-admin {
      width: min(1100px, calc(100% - 30px));
      margin: 40px auto;
    }

    .hm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .hm-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .hm-logo span {
      color: #1597ff;
    }

    .hm-subtitle {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .hm-refresh {
      border: 1px solid #252b33;
      background: #11161d;
      color: #ccc;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hm-refresh:hover {
      background: #181e26;
    }

    .hm-section {
      margin-bottom: 35px;
    }

    .hm-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #20252c;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .hm-section-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .hm-count {
      color: #777;
      font-size: 13px;
    }

    .hm-movie-list {
      display: grid;
      gap: 10px;
    }

    .hm-movie {
      background: #10151c;
      border: 1px solid #202731;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .hm-movie-info {
      flex: 1;
      min-width: 0;
    }

    .hm-movie-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .hm-movie-id {
      color: #666;
      font-size: 12px;
    }

    .hm-servers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .hm-server-status {
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #181d24;
      color: #666;
    }

    .hm-server-status.active {
      color: #6ee7a2;
      background: rgba(50, 180, 110, 0.10);
    }

    .hm-action {
      flex-shrink: 0;
      border: 0;
      background: #1597ff;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .hm-action:hover {
      background: #087fdc;
    }

    .hm-empty {
      padding: 25px;
      text-align: center;
      background: #10151c;
      border: 1px dashed #282f38;
      border-radius: 10px;
      color: #777;
    }

    /* EDITOR */

    .hm-editor {
      display: none;
      background: #10151c;
      border: 1px solid #29313b;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 35px;
    }

    .hm-editor.active {
      display: block;
    }

    .hm-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .hm-editor-title {
      margin: 0;
      font-size: 20px;
    }

    .hm-close {
      border: 1px solid #303740;
      background: transparent;
      color: #aaa;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hm-server-box {
      border: 1px solid #252d37;
      background: #0b0f14;
      border-radius: 9px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .hm-server-box h3 {
      margin: 0 0 15px;
      font-size: 14px;
      color: #1597ff;
    }

    .hm-fields {
      display: grid;
      grid-template-columns: 180px 160px 1fr;
      gap: 10px;
    }

    .hm-field label {
      display: block;
      color: #777;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .hm-field input,
    .hm-field select {
      width: 100%;
      border: 1px solid #2a313a;
      background: #151a21;
      color: white;
      padding: 10px;
      border-radius: 6px;
      outline: none;
    }

    .hm-field input:focus,
    .hm-field select:focus {
      border-color: #1597ff;
    }

    .hm-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .hm-cancel {
      border: 1px solid #303740;
      background: transparent;
      color: #aaa;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
    }

    .hm-save {
      border: 0;
      background: #1597ff;
      color: white;
      padding: 11px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .hm-save:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .hm-status {
      display: none;
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 13px;
    }

    .hm-status.show {
      display: block;
    }

    .hm-status.success {
      background: rgba(50, 180, 110, 0.12);
      border: 1px solid rgba(50, 180, 110, 0.3);
      color: #6ee7a2;
    }

    .hm-status.error {
      background: rgba(220, 60, 60, 0.12);
      border: 1px solid rgba(220, 60, 60, 0.3);
      color: #ff8888;
    }

    .hm-loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 750px) {

      .hm-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .hm-movie {
        align-items: flex-start;
        flex-direction: column;
      }

      .hm-action {
        width: 100%;
      }

      .hm-fields {
        grid-template-columns: 1fr;
      }

      .hm-editor-actions {
        flex-direction: column;
      }

      .hm-save,
      .hm-cancel {
        width: 100%;
      }

    }
  </style>
</head>

<body>

  <div class="hm-admin">

    <div class="hm-header">

      <div>
        <div class="hm-logo">
          HORA <span>Movies</span>
        </div>

        <div class="hm-subtitle">
          Stream Manager
        </div>
      </div>

      <button
        class="hm-refresh"
        onclick="loadMovies()">
        Refresh
      </button>

    </div>


    <div
      id="status"
      class="hm-status">
    </div>


    <!-- EDITOR -->

    <div
      id="editor"
      class="hm-editor">

      <div class="hm-editor-header">

        <h2
          id="editorTitle"
          class="hm-editor-title">
          Movie
        </h2>

        <button
          class="hm-close"
          onclick="closeEditor()">
          Close
        </button>

      </div>


      <div id="serverFields">

        <!-- SERVER FIELDS GENERATED HERE -->

      </div>


      <div class="hm-editor-actions">

        <button
          class="hm-cancel"
          onclick="closeEditor()">
          Cancel
        </button>

        <button
          id="saveButton"
          class="hm-save"
          onclick="saveStreams()">
          Save Streams
        </button>

      </div>

    </div>


    <!-- MOVIES WITH LINKS -->

    <section class="hm-section">

      <div class="hm-section-title">

        <h2>
          Movies With Links
        </h2>

        <span
          id="withCount"
          class="hm-count">
          0
        </span>

      </div>

      <div
        id="withLinks"
        class="hm-movie-list">

        <div class="hm-loading">
          Loading movies...
        </div>

      </div>

    </section>


    <!-- MOVIES WITHOUT LINKS -->

    <section class="hm-section">

      <div class="hm-section-title">

        <h2>
          Movies Without Links
        </h2>

        <span
          id="withoutCount"
          class="hm-count">
          0
        </span>

      </div>

      <div
        id="withoutLinks"
        class="hm-movie-list">

        <div class="hm-loading">
          Loading movies...
        </div>

      </div>

    </section>

  </div>


<script>
//<![CDATA[

const API =
  'https://hora-movies-api.dailylivescoress.workers.dev';

const LATEST_API =
  'https://hora-movies.pages.dev/latest.json';

let movies = [];
let streams = {};
let selectedMovie = null;


/* --------------------------------
   LOAD EVERYTHING
-------------------------------- */

async function loadMovies() {

  const withLinks =
    document.getElementById('withLinks');

  const withoutLinks =
    document.getElementById('withoutLinks');

  withLinks.innerHTML =
    '<div class="hm-loading">Loading movies...</div>';

  withoutLinks.innerHTML =
    '<div class="hm-loading">Loading movies...</div>';

  try {

    const [
      moviesResponse,
      streamsResponse
    ] = await Promise.all([

      fetch(
        LATEST_API + '?t=' + Date.now()
      ),

      fetch(
        API + '/streams?t=' + Date.now()
      )

    ]);


    if (!moviesResponse.ok) {
      throw new Error(
        'Unable to load latest.json'
      );
    }


    if (!streamsResponse.ok) {
      throw new Error(
        'Unable to load streams.json'
      );
    }


    movies =
      await moviesResponse.json();

    streams =
      await streamsResponse.json();


    renderMovies();


  } catch (error) {

    console.error(error);

    withLinks.innerHTML = `
      <div class="hm-empty">
        ${escapeHtml(error.message)}
      </div>
    `;

    withoutLinks.innerHTML = '';

  }

}


/* --------------------------------
   RENDER MOVIES
-------------------------------- */

function renderMovies() {

  const withLinks =
    document.getElementById('withLinks');

  const withoutLinks =
    document.getElementById('withoutLinks');

  withLinks.innerHTML = '';
  withoutLinks.innerHTML = '';


  let withCount = 0;
  let withoutCount = 0;


  movies.forEach(movie => {

    const movieStream =
      streams[movie.id];


    const hasLinks =
      movieStream &&
      Object.values(movieStream).some(server =>
        server &&
        server.url &&
        server.url.trim() !== ''
      );


    const card =
      createMovieCard(
        movie,
        movieStream,
        hasLinks
      );


    if (hasLinks) {

      withLinks.appendChild(card);
      withCount++;

    } else {

      withoutLinks.appendChild(card);
      withoutCount++;

    }

  });


  document.getElementById('withCount').textContent =
    withCount;

  document.getElementById('withoutCount').textContent =
    withoutCount;


  if (!withCount) {

    withLinks.innerHTML = `
      <div class="hm-empty">
        No movies have stream links yet.
      </div>
    `;

  }


  if (!withoutCount) {

    withoutLinks.innerHTML = `
      <div class="hm-empty">
        All movies have stream links.
      </div>
    `;

  }

}


/* --------------------------------
   CREATE MOVIE CARD
-------------------------------- */

function createMovieCard(
  movie,
  movieStream,
  hasLinks
) {

  const card =
    document.createElement('div');

  card.className =
    'hm-movie';


  const info =
    document.createElement('div');

  info.className =
    'hm-movie-info';


  const title =
    document.createElement('div');

  title.className =
    'hm-movie-title';

  title.textContent =
    movie.id;


  const id =
    document.createElement('div');

  id.className =
    'hm-movie-id';

  id.textContent =
    'TMDB ID: ' +
    movie.tmdb_id;


  const servers =
    document.createElement('div');

  servers.className =
    'hm-servers';


  for (
    let i = 1;
    i <= 3;
    i++
  ) {

    const server =
      movieStream &&
      movieStream['server' + i];


    const active =
      server &&
      server.url &&
      server.url.trim() !== '';


    const badge =
      document.createElement('span');

    badge.className =
      'hm-server-status' +
      (active ? ' active' : '');

    badge.textContent =
      active
        ? '✓ Server ' + i
        : '— Server ' + i;


    servers.appendChild(badge);

  }


  info.appendChild(title);
  info.appendChild(id);
  info.appendChild(servers);


  const button =
    document.createElement('button');

  button.className =
    'hm-action';

  button.textContent =
    hasLinks
      ? 'Edit'
      : 'Add Links';


  button.onclick =
    () => openEditor(movie);


  card.appendChild(info);
  card.appendChild(button);


  return card;

}


/* --------------------------------
   OPEN EDITOR
-------------------------------- */

function openEditor(movie) {

  selectedMovie =
    movie;


  document.getElementById(
    'editorTitle'
  ).textContent =
    movie.id;


  const container =
    document.getElementById(
      'serverFields'
    );


  container.innerHTML = '';


  const movieStream =
    streams[movie.id] || {};


  for (
    let i = 1;
    i <= 3;
    i++
  ) {

    const server =
      movieStream['server' + i] || {

        name:
          'Server ' + i,

        type:
          i === 3
            ? 'm3u8'
            : 'iframe',

        url:
          ''

      };


    const box =
      document.createElement('div');

    box.className =
      'hm-server-box';


    box.innerHTML = `

      <h3>
        Server ${i}
      </h3>

      <div class="hm-fields">

        <div class="hm-field">

          <label>
            Server Name
          </label>

          <input
            id="server${i}Name"
            type="text"
            value="${escapeAttr(server.name || '')}"
            placeholder="Server ${i}"
          >

        </div>


        <div class="hm-field">

          <label>
            Stream Type
          </label>

          <select
            id="server${i}Type">

            <option
              value="iframe"
              ${server.type === 'iframe' ? 'selected' : ''}>
              iframe
            </option>

            <option
              value="m3u8"
              ${server.type === 'm3u8' ? 'selected' : ''}>
              m3u8
            </option>

          </select>

        </div>


        <div class="hm-field">

          <label>
            Stream URL
          </label>

          <input
            id="server${i}Url"
            type="url"
            value="${escapeAttr(server.url || '')}"
            placeholder="https://..."
          >

        </div>

      </div>

    `;


    container.appendChild(box);

  }


  document
    .getElementById('editor')
    .classList.add('active');


  document
    .getElementById('editor')
    .scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

}


/* --------------------------------
   CLOSE EDITOR
-------------------------------- */

function closeEditor() {

  selectedMovie =
    null;

  document
    .getElementById('editor')
    .classList.remove('active');

}


/* --------------------------------
   SAVE STREAMS
-------------------------------- */

async function saveStreams() {

  if (!selectedMovie) {
    return;
  }


  const saveButton =
    document.getElementById(
      'saveButton'
    );


  const updatedMovie = {};


  for (
    let i = 1;
    i <= 3;
    i++
  ) {

    updatedMovie[
      'server' + i
    ] = {

      name:
        document.getElementById(
          'server' + i + 'Name'
        ).value.trim()
        ||
        'Server ' + i,

      type:
        document.getElementById(
          'server' + i + 'Type'
        ).value,

      url:
        document.getElementById(
          'server' + i + 'Url'
        ).value.trim()

    };

  }


  streams[selectedMovie.id] =
    updatedMovie;


  saveButton.disabled =
    true;

  saveButton.textContent =
    'Saving...';


  showStatus(
    'Saving stream data...',
    ''
  );


  try {

    const response =
      await fetch(
        API + '/admin/streams',
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(streams)

        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        'Failed to save streams'
      );

    }


    showStatus(
      '✓ Streams saved successfully.',
      'success'
    );


    renderMovies();

    closeEditor();


  } catch (error) {

    console.error(error);

    showStatus(
      error.message,
      'error'
    );

  }


  saveButton.disabled =
    false;

  saveButton.textContent =
    'Save Streams';

}


/* --------------------------------
   STATUS MESSAGE
-------------------------------- */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.className =
    'hm-status show ' +
    (type || '');

}


/* --------------------------------
   HTML ESCAPING
-------------------------------- */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttr(value) {

  return escapeHtml(value);

}


/* --------------------------------
   START
-------------------------------- */

document.addEventListener(
  'DOMContentLoaded',
  loadMovies
);

//]]>
</script>

</body>
</html>
